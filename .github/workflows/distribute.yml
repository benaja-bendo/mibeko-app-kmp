name: Distribute to Firebase

on:
  workflow_dispatch: # déclencher le déploiement manuellement
    inputs:
      release_notes:
        description: 'Notes de version'
        required: true
        default: 'Nouvelle version de test'

jobs:
  distribute:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository (historique complet pour le versionCode)
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Optionnel: Décoder le keystore pour signer l'application en mode Release
    # Vous devez ajouter ces secrets dans GitHub: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ENCODED_STRING" ]; then
          echo $ENCODED_STRING | base64 -di > keystore.jks
        fi

    # Optionnel: Mettre en place les credentials Google Services
    # Utile si vous utilisez un Service Account Firebase au lieu de FIREBASE_TOKEN
    - name: Decode Google Services
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo $GOOGLE_SERVICES_JSON | base64 -di > androidApp/google-services.json
        fi

    # Même calcul que release-play.yml : le nombre de commits est monotone, donc un
    # testeur Firebase peut toujours installer par-dessus la build précédente. Un
    # versionCode figé bloquerait la mise à jour sur les appareils déjà équipés.
    - name: Compute version
      id: version
      run: |
        VERSION_NAME="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
        VERSION_NAME="${VERSION_NAME:-0.0.0}"
        VERSION_CODE="$(git rev-list --count HEAD)"
        echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Version $VERSION_NAME (code $VERSION_CODE)"

    - name: Build and Distribute App to Firebase
      env:
        # Variables pour la signature de l'application
        KEYSTORE_FILE: ../keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Identifiants Firebase pour l'upload CI/CD
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      run: |
        ./gradlew :androidApp:assembleRelease :androidApp:appDistributionUploadRelease \
          -PversionName="${{ steps.version.outputs.name }}" \
          -PversionCode="${{ steps.version.outputs.code }}" \
          -PappDistribution-releaseNotes="${{ github.event.inputs.release_notes }}"
