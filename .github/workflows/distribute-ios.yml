name: Distribute iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes de version'
        required: true
        default: 'Nouvelle version de test'
      marketing_version:
        # App Store Connect refuse une soumission dont la version n'a pas été
        # bumpée : la valeur du Config.xcconfig (1.0, déjà publiée) ne doit
        # plus jamais partir telle quelle.
        description: 'Version marketing (ex: 1.1.0) — doit être > à la version publiée'
        required: true

jobs:
  distribute-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Cache Kotlin Native (Konan)
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set iOS Build Number
      id: build_number
      run: |
        # On calcule le numéro de build basé sur le run de GitHub + un décalage
        # pour s'assurer d'être supérieur aux anciens builds manuels.
        BUILD_NUM=$((${{ github.run_number }} + 25))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        echo "Build number set to: $BUILD_NUM"

    # Le GoogleService-Info.plist ne vit jamais dans le dépôt. Secret absent =
    # build sans Firebase (FirebaseApp.configure() est gardé côté Swift).
    # Une livraison TestFlight/App Store sans Firebase serait un binaire sans
    # Analytics ni Crashlytics — précisément ce que cette version corrige. On
    # échoue donc bruyamment, et on valide le contenu du plist : un secret mal
    # encodé (le google-services.json Android, par exemple) passerait le
    # décodage base64 mais ferait crasher l'app au lancement.
    - name: Setup GoogleService-Info.plist
      env:
        IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}
      run: |
        if [ -z "$IOS_GOOGLE_SERVICES_PLIST" ]; then
          echo "::error::Secret IOS_GOOGLE_SERVICES_PLIST absent — livraison refusée (binaire sans Analytics ni Crashlytics)"
          exit 1
        fi
        PLIST=iosApp/iosApp/GoogleService-Info.plist
        echo "$IOS_GOOGLE_SERVICES_PLIST" | base64 -d > "$PLIST"
        plutil -lint "$PLIST"
        BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$PLIST")
        /usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$PLIST" > /dev/null
        if [ "$BUNDLE_ID" != "cg.mibeko.app" ]; then
          echo "::error::GoogleService-Info.plist pour le mauvais bundle ($BUNDLE_ID)"
          exit 1
        fi
        echo "GoogleService-Info.plist injecté et validé ($BUNDLE_ID)"

    - name: Install Apple Certificate and Provisioning Profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        security create-keychain -p "actions" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "actions" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
        # Un UUID vide se propagerait en PROVISIONING_PROFILE_SPECIFIER vide, et
        # xcodebuild renverrait alors « iosApp requires a provisioning profile »,
        # message qui pointe vers l'éditeur Xcode et jamais vers le secret fautif.
        if [ -z "$UUID" ]; then
          echo "::error::UUID introuvable dans BUILD_PROVISION_PROFILE_BASE64 — secret absent ou mal encodé"
          exit 1
        fi
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
        echo "PP_UUID=$UUID" >> $GITHUB_ENV

        # L'app réclame « Associated Domains » (Universal Links mibeko.fr, cf.
        # iosApp/iosApp.entitlements). Si le profil ne porte pas la capability,
        # xcodebuild échoue après ~20 min de compilation sur un message qui ne
        # la nomme pas. On tranche ici, en trois secondes et en clair.
        security cms -D -i $PP_PATH > $RUNNER_TEMP/pp.plist
        if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" $RUNNER_TEMP/pp.plist > /dev/null 2>&1; then
          echo "::error::Le profil de provisioning ne porte pas « Associated Domains ». Activer la capability sur l'App ID cg.mibeko.app (developer.apple.com), régénérer le profil de distribution, puis mettre à jour le secret BUILD_PROVISION_PROFILE_BASE64."
          exit 1
        fi
        echo "✓ Associated Domains présent dans le profil"

    # Ce contrôle échoue AVANT les ~20 min de compilation Kotlin + Firebase, et
    # attrape le cas où l'onglet « Signing & Capabilities » de Xcode aurait
    # silencieusement réécrit les réglages de signature dans le pbxproj.
    - name: Verify Signing Configuration
      run: |
        cd iosApp
        SETTINGS=$(xcodebuild -showBuildSettings \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          MIBEKO_PROVISIONING_PROFILE="${{ env.PP_UUID }}")

        expect() {
          ACTUAL=$(printf '%s\n' "$SETTINGS" | sed -n "s/^ *$1 = //p" | head -1)
          if [ "$ACTUAL" != "$2" ]; then
            echo "::error::$1 vaut « $ACTUAL » au lieu de « $2 » — signature non conforme, livraison interrompue"
            exit 1
          fi
          echo "✓ $1 = $ACTUAL"
        }

        expect CODE_SIGN_STYLE Manual
        expect CODE_SIGN_IDENTITY "Apple Distribution"
        expect DEVELOPMENT_TEAM G2VC572UTM
        expect PROVISIONING_PROFILE_SPECIFIER "${{ env.PP_UUID }}"

    # Un réglage passé en ligne de commande à xcodebuild s'applique à TOUTES les
    # targets, y compris aux projets synthétisés par SwiftPM. Depuis l'arrivée de
    # Firebase, y forcer la signature cassait l'archive : les bundles de ressources
    # (Firebase_*, GoogleUtilities_*, Promises_*, nanopb_*) réclamaient une équipe,
    # puis refusaient le profil qu'on leur imposait. La signature vit donc dans la
    # config Release de la target iosApp, et seul l'identifiant du profil — qui
    # change à chaque run — transite par une variable maison, sans signification
    # pour les targets SwiftPM.
    - name: Build and Archive iOS App
      run: |
        cd iosApp
        # CURRENT_PROJECT_VERSION / MARKETING_VERSION restent en ligne de commande :
        # ils fuient vers les targets SwiftPM sans conséquence, et ExportOptions.plist
        # a manageAppVersionAndBuildNumber=false, donc la version doit être juste ici.
        xcodebuild archive \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -archivePath $RUNNER_TEMP/iosApp.xcarchive \
          MIBEKO_PROVISIONING_PROFILE="${{ env.PP_UUID }}" \
          CURRENT_PROJECT_VERSION="${{ env.BUILD_NUM }}" \
          MARKETING_VERSION="${{ github.event.inputs.marketing_version }}"

    - name: Export IPA
      run: |
        cd iosApp
        /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:cg.mibeko.app ${{ env.PP_UUID }}" ExportOptions.plist
        
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/iosApp.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath $RUNNER_TEMP/export

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
        
        set -e
        # Utilisation de la syntaxe moderne recommandée pour l'upload
        xcrun altool --upload-app \
          -f $RUNNER_TEMP/export/mibeko.ipa \
          -t ios \
          --apiKey "$APP_STORE_CONNECT_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"