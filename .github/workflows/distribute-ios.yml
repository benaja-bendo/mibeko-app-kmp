name: Distribute iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes de version'
        required: true
        default: 'Nouvelle version de test'

jobs:
  distribute-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install Apple Certificate and Provisioning Profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Décoder le certificat et le profil de provisionnement depuis la Base64
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # Créer un trousseau d'accès (keychain) temporaire
        security create-keychain -p "actions" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "actions" $KEYCHAIN_PATH

        # Importer le certificat dans le trousseau
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Appliquer le profil de provisionnement
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

    - name: Build and Archive iOS App
      run: |
        cd iosApp
        
        # NOTE : Si vous utilisez CocoaPods, décommentez "pod install" et remplacez "-project iosApp.xcodeproj" par "-workspace iosApp.xcworkspace"
        # pod install
        
        # Archive l'application
        xcodebuild archive \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -archivePath $RUNNER_TEMP/iosApp.xcarchive \
          CODE_SIGN_STYLE=Manual \
          PROVISIONING_PROFILE_SPECIFIER="Mibeko App Store Profile" \
          CODE_SIGN_IDENTITY="Apple Distribution"

    - name: Export IPA
      run: |
        cd iosApp
        # Exporte l'archive en fichier .ipa pour TestFlight
        # Un fichier ExportOptions.plist doit être présent dans le dossier iosApp/
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/iosApp.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath $RUNNER_TEMP/export

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      run: |
        # Sauvegarder la clé API .p8 dans le dossier attendu par altool
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
        
        # Uploader l'application vers TestFlight
        xcrun altool --upload-app -f $RUNNER_TEMP/export/mibeko.ipa -t ios \
          --apiKey "$APP_STORE_CONNECT_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
