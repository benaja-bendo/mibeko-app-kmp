name: Build and Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Deux poussées rapprochées sur une même branche lançaient deux fois le job
# macOS, dont ce fichier rappelle lui-même qu'il coûte environ dix fois un
# runner Linux. Sur une pull request, seule la dernière version compte : on
# annule la précédente. Sur `main` on laisse finir, pour ne pas laisser un
# commit sans verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo '{"project_info":{"project_number":"123","project_id":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"cg.mibeko.app"}},"api_key":[{"current_key":"mock"}]}],"configuration_version":"1"}' > androidApp/google-services.json
        else
          echo "$GOOGLE_SERVICES_JSON" | base64 -di > androidApp/google-services.json
        fi

    # Compile les deux modules : `:androidApp:compileDebugKotlin` dépend de
    # `:composeApp:compileAndroidMain`. Le module KMP n'a plus de variantes de
    # build depuis la séparation AGP 9 — d'où la disparition du « Debug » dans
    # ses noms de tâches.
    - name: Build Android Debug
      run: ./gradlew :androidApp:compileDebugKotlin --stacktrace

    - name: Run Android Tests
      run: ./gradlew :composeApp:testAndroidHostTest --stacktrace

  # Le binaire publié est minifié par R8 : une régression visible uniquement
  # après obfuscation (règles proguard manquantes sur un modèle sérialisé) ne
  # doit pas être découverte au moment de la release. AAB non signé (pas de
  # keystore en CI de PR), seul le pipeline R8 est exercé.
  build-android-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo '{"project_info":{"project_number":"123","project_id":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"cg.mibeko.app"}},"api_key":[{"current_key":"mock"}]}],"configuration_version":"1"}' > androidApp/google-services.json
        else
          echo "$GOOGLE_SERVICES_JSON" | base64 -di > androidApp/google-services.json
        fi

    # versionCode obligatoire depuis le garde-fou anti-rejet Play (build.gradle.kts) :
    # tout packaging release doit l'annoncer explicitement. Cet AAB n'est ni signé ni
    # publié — il n'existe que pour exercer R8 — d'où une valeur fixe assumée, qui ne
    # peut pas entrer en collision avec un versionCode de la Play Console.
    - name: Build release AAB (unsigned, R8)
      run: |
        ./gradlew :androidApp:bundleRelease \
          -PversionCode=1 \
          -PversionName=0.0.0-ci \
          --stacktrace

  # La moitié iOS du parc était invisible en CI : iosMain n'était jamais
  # compilé, les casses Kotlin/Native se découvraient à la soumission.
  # linkDebugFrameworkIosArm64 attrape erreurs de compile ET de link, sans
  # signature ni secrets Apple. Restreint à main (runners macOS ~10x le prix
  # des runners Linux).
  #
  # `commonTest` n'était en revanche jamais compilé pour Native : il ne
  # tournait que sur la JVM. Les deux plateformes n'acceptent pas les mêmes
  # noms de fonction — Kotlin/Native refuse parenthèses et virgules dans un
  # identifiant entre accents graves — et un test partagé pouvait donc être
  # incompilable côté iOS sans que rien ne le dise. C'était le cas.
  build-ios:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5

    # Kotlin/Native est sensible à la version d'Xcode. `latest-stable` ne fige
    # rien : il suit l'image du runner. Ce qui est garanti ici, c'est que ce
    # job et `distribute-ios.yml` bougent *ensemble* — une régression liée à
    # Xcode se voit donc en CI avant de se voir à la soumission. Épingler une
    # version précise serait plus sûr, mais casse net le jour où l'image du
    # runner cesse de l'embarquer : à arbitrer si le cas se présente.
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # La toolchain Kotlin/Native (plusieurs Go) dépend de la version de Kotlin
    # et des options `kotlin.native.*` — de rien d'autre. L'ancienne clé se
    # trompait dans les deux sens : elle ignorait `libs.versions.toml`, où vit
    # la version de Kotlin, donc une montée de version réutilisait une
    # toolchain périmée ; et elle englobait tous les `*.gradle.kts`, donc
    # l'ajout d'une dépendance sans rapport réécrivait un cache de plusieurs
    # Go, poussant les autres hors du quota du dépôt.
    - name: Cache Kotlin Native (Konan)
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile and link iOS framework
      run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace

    # Les mêmes tests que `testAndroidHostTest`, mais exécutés par le
    # compilateur Native sur le simulateur : c'est le seul moyen de savoir que
    # le code partagé se comporte pareil des deux côtés. 108 tests, ~45 s.
    - name: Run shared tests on Kotlin/Native
      run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace
