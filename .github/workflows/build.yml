name: Build and Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo '{"project_info":{"project_number":"123","project_id":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"cg.mibeko.app"}},"api_key":[{"current_key":"mock"}]}],"configuration_version":"1"}' > composeApp/google-services.json
        else
          echo "$GOOGLE_SERVICES_JSON" | base64 -di > composeApp/google-services.json
        fi

    - name: Build Android Debug
      run: ./gradlew compileDebugKotlinAndroid --stacktrace

    - name: Run Android Tests
      run: ./gradlew testDebugUnitTest --stacktrace

  # Le binaire publié est minifié par R8 : une régression visible uniquement
  # après obfuscation (règles proguard manquantes sur un modèle sérialisé) ne
  # doit pas être découverte au moment de la release. AAB non signé (pas de
  # keystore en CI de PR), seul le pipeline R8 est exercé.
  build-android-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo '{"project_info":{"project_number":"123","project_id":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"cg.mibeko.app"}},"api_key":[{"current_key":"mock"}]}],"configuration_version":"1"}' > composeApp/google-services.json
        else
          echo "$GOOGLE_SERVICES_JSON" | base64 -di > composeApp/google-services.json
        fi

    # versionCode obligatoire depuis le garde-fou anti-rejet Play (build.gradle.kts) :
    # tout packaging release doit l'annoncer explicitement. Cet AAB n'est ni signé ni
    # publié — il n'existe que pour exercer R8 — d'où une valeur fixe assumée, qui ne
    # peut pas entrer en collision avec un versionCode de la Play Console.
    - name: Build release AAB (unsigned, R8)
      run: |
        ./gradlew :composeApp:bundleRelease \
          -PversionCode=1 \
          -PversionName=0.0.0-ci \
          --stacktrace

  # La moitié iOS du parc était invisible en CI : iosMain n'était jamais
  # compilé, les casses Kotlin/Native se découvraient à la soumission.
  # linkDebugFrameworkIosArm64 attrape erreurs de compile ET de link, sans
  # signature ni secrets Apple. Restreint à main (runners macOS ~10x le prix
  # des runners Linux).
  build-ios:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5

    # Xcode figé comme dans distribute-ios.yml : Kotlin/Native est sensible à
    # la version, un bump de l'image macos-latest casserait ce job seul.
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Kotlin Native (Konan)
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile and link iOS framework
      run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace
