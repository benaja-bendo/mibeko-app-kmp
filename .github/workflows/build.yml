name: Build and Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo '{"project_info":{"project_number":"123","project_id":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.mibeko.mibeko"}},"api_key":[{"current_key":"mock"}]}],"configuration_version":"1"}' > composeApp/google-services.json
        else
          echo "$GOOGLE_SERVICES_JSON" | base64 -di > composeApp/google-services.json
        fi

    - name: Build Android Debug
      run: ./gradlew compileDebugKotlinAndroid --stacktrace

    - name: Run Android Tests
      run: ./gradlew testDebugUnitTest --stacktrace
