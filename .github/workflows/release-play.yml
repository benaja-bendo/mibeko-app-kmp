name: Release to Google Play

# Déclenchement :
#  - automatiquement quand tu pousses un tag de version (ex: v1.0.1)
#  - ou manuellement depuis l'onglet "Actions" (bouton "Run workflow")
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Nom de version (ex: 1.0.1)'
        required: true
      track:
        description: 'Canal de publication Play'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal      # testeurs internes (publication immédiate, pas de revue)
          - alpha         # test fermé
          - beta          # test ouvert
          - production    # production (passe en revue Google)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour le versionCode)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- Secrets décodés vers des fichiers ---
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -di > keystore.jks

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -di > androidApp/google-services.json

      # --- Calcul des versions ---
      # versionName : vient du tag (v1.0.1 -> 1.0.1) ou de l'entrée manuelle.
      # versionCode : nombre total de commits -> toujours croissant, jamais en double.
      - name: Compute version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.versionName }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION_NAME (code $VERSION_CODE)"

      - name: Build signed AAB
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:bundleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --stacktrace

      # Production = rollout progressif (20 %) : une régression découverte en
      # prod ne touche qu'une fraction du parc, et se complète/interrompt
      # depuis la Play Console. Les autres canaux publient à 100 % direct.
      - name: Upload to Google Play (production, rollout 20%)
        if: ${{ (github.event.inputs.track || 'internal') == 'production' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cg.mibeko.app
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: production
          status: inProgress
          userFraction: 0.2

      - name: Upload to Google Play (canaux de test)
        if: ${{ (github.event.inputs.track || 'internal') != 'production' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cg.mibeko.app
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      # L'annonce de latest_version au backend (force-update mobile) N'EST PAS
      # automatique ici : la prod part en rollout progressif (20 %, ligne 96),
      # alors qu'annoncer la version pousserait la bannière à 100 % du parc
      # immédiatement — 80 % des utilisateurs taperaient « Mettre à jour » sur
      # une version pas encore disponible pour eux. Déclencher manuellement le
      # workflow announce-mobile-version.yml une fois le rollout à 100 % dans
      # la Play Console.
